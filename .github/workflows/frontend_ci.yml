name: Frontend CI

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Working directory for frontend commands"
        required: false
        default: "frontend"
        type: string
      node_version_file:
        description: "Path to the Node version file"
        required: false
        default: "frontend/.nvmrc"
        type: string
      cache_dependency_path:
        description: "Dependency lockfiles used for npm cache"
        required: false
        default: "**/package-lock.json"
        type: string
      install_command:
        description: "Install command"
        required: false
        default: "npm ci"
        type: string
      build_command:
        description: "Build command"
        required: false
        default: "npm run build --if-present"
        type: string
      test_command:
        description: "Test command"
        required: false
        default: "npm test"
        type: string
      timeout_minutes:
        description: "Job timeout in minutes"
        required: false
        default: 15
        type: number

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ inputs.timeout_minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ${{ inputs.node_version_file }}
          cache: "npm"
          cache-dependency-path: ${{ inputs.cache_dependency_path }}
      - run: ${{ inputs.install_command }}
      - run: ${{ inputs.build_command }}
      - run: ${{ inputs.test_command }}
