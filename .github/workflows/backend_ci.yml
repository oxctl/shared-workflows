name: Backend CI

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Working directory for backend commands"
        required: false
        default: "backend"
        type: string
      java_version_file:
        description: "Path to the Java version file"
        required: false
        default: "backend/.java-version"
        type: string
      java_distribution:
        description: "Java distribution name"
        required: false
        default: "temurin"
        type: string
      build_command:
        description: "Backend build command"
        required: false
        default: "mvn -ntp -B package --file pom.xml"
        type: string
      timeout_minutes:
        description: "Job timeout in minutes"
        required: false
        default: 10
        type: number

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ inputs.timeout_minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version-file: ${{ inputs.java_version_file }}
          distribution: ${{ inputs.java_distribution }}
          cache: "maven"
      - name: Build with Maven
        run: ${{ inputs.build_command }}
