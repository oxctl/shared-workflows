name: AWS CloudFormation validation

on:
  workflow_call:
    inputs:
      aws_region:
        description: "AWS region"
        required: true
        type: string
      aws_account_id:
        description: "AWS account ID"
        required: true
        type: string
      aws_role_name:
        description: "Role name to assume in the target account"
        required: false
        default: "cad-github-actions-role"
        type: string
      template_paths:
        description: "Comma or newline separated list of CloudFormation template paths"
        required: false
        default: |
          aws/stack.yaml
          aws/bootstrap.yaml
          aws/s3-and-cloudfront.yaml
        type: string
      timeout_minutes:
        description: "Job timeout in minutes"
        required: false
        default: 5
        type: number

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/${{ inputs.aws_role_name }}
          aws-region: ${{ inputs.aws_region }}
      - name: Validate CloudFormation templates
        env:
          TEMPLATE_PATHS: ${{ inputs.template_paths }}
        run: |
          printf '%s\n' "$TEMPLATE_PATHS" \
            | tr ',' '\n' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | sed '/^$/d' \
            | while IFS= read -r template; do
                echo "Validating $template"
                aws cloudformation validate-template --template-body "file://$template"
              done
